[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carsel-cvd"
version = "0.2.0"
description = "Research software for leakage-controlled cascaded ensemble learning on tabular cardiovascular data"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "CaRSEL-CVD research team"}]
keywords = ["research software", "machine learning", "cardiovascular", "cascaded ensemble"]
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "pydantic>=2,<3",
  "python-multipart>=0.0.9,<1",
  "numpy>=1.26,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.5,<1"]

[project.scripts]
carsel-train = "carsel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
carsel = ["web/*.html", "web/assets/*.css", "web/assets/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
